version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: learnquest-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - learnquest-network

  redis:
    image: redis:7.0-alpine
    container_name: learnquest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - learnquest-network

volumes:
  mongodb_data:
  redis_data:

networks:
  learnquest-network:
    driver: bridge
