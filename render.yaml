services:
  # 1. Express Backend Service
  - type: web
    name: learnquest-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=packages/shared-types && npm run build --workspace=packages/validation && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: learnquest-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        value: LearnQuest India <onboarding@resend.dev>
      - key: CORS_ORIGINS
        sync: false

  # 2. Redis Cache Database
  - type: redis
    name: learnquest-redis
    plan: free
    ipAllowList: [] # Only allow internal connection access
